name: ContentBridge v1 contracts
on:
  push:
  pull_request:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP behavior and security regression
        run: php tests/contentbridge-v1-unit.php
      - name: PHP lint bridge
        run: find plugins/cm91-content-bridge -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Shared component provenance
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,pathlib
          p=pathlib.Path('plugins/cm91-content-bridge')
          manifest=json.loads((p/'contentbridge-v1-provenance.json').read_text())
          assert hashlib.sha256((p/'contentbridge-v1.php').read_bytes()).hexdigest()==manifest['sha256']
          PYCODE
