name: Deploy comiker91.de

on:
  push:
    branches:
      - main
    paths:
      - 'plugins/**'
      - 'themes/**'
      - 'content/**'
      - 'scripts/validate-content-package.php'
      - '.github/workflows/deploy-comiker91.yml'
  workflow_dispatch:

concurrency:
  group: comiker91-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy WordPress code
    runs-on: [self-hosted, linux, x64, seo]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate repository layout
        shell: bash
        run: |
          set -euo pipefail
          test -d plugins
          test -d themes
          find plugins themes -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
          test -f scripts/validate-content-package.php
          php -l scripts/validate-content-package.php
      - name: Check deployment secret exists
        env:
          CM91_DEPLOY_SECRET: ${{ secrets.CM91_DEPLOY_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CM91_DEPLOY_SECRET:-}" || { echo 'Repository secret CM91_DEPLOY_SECRET is missing.' >&2; exit 1; }
      - name: Preserve legacy binary theme assets
        shell: bash
        run: |
          set -euo pipefail
          LOGO='themes/comiker91-streamer-theme/assets/images/logoComiker.png'
          if [ ! -f "$LOGO" ]; then
            mkdir -p "$(dirname "$LOGO")"
            curl --fail --silent --show-error --location --max-time 20 'https://comiker91.de/wp-content/themes/comiker91-streamer-theme/assets/images/logoComiker.png' --output "$LOGO"
            test -s "$LOGO"
          fi
      - name: Build deployment package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/comiker91-deploy.zip"
          zip -q -r "$ARCHIVE" plugins themes -x '*/.DS_Store' '*/Thumbs.db' '*/.gitkeep'
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
      - name: Sign and deploy to comiker91.de
        env:
          CM91_DEPLOY_SECRET: ${{ secrets.CM91_DEPLOY_SECRET }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          SIGNATURE="$(openssl dgst -sha256 -hmac "$CM91_DEPLOY_SECRET" "$ARCHIVE" | awk '{print $2}')"
          RESPONSE="$RUNNER_TEMP/deploy-response.json"
          HTTP_CODE="$(curl --silent --show-error --output "$RESPONSE" --write-out '%{http_code}' --request POST --header "X-CM91-Deploy-Signature: sha256=$SIGNATURE" --header "X-CM91-Commit: $GITHUB_SHA" --form "package=@${ARCHIVE};type=application/zip" 'https://comiker91.de/wp-json/cm91-deploy/v1/push')"
          cat "$RESPONSE"; echo
          test "$HTTP_CODE" -ge 200 && test "$HTTP_CODE" -lt 300
      - name: Verify public site and content bridge
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 30 https://comiker91.de/)"
          test "$code" -ge 200 && test "$code" -lt 400
          HEALTH_FILE="$RUNNER_TEMP/cm91-content-health.txt"
          HEALTH_CODE="$(curl --silent --show-error --output "$HEALTH_FILE" --write-out '%{http_code}' --max-time 20 'https://comiker91.de/wp-json/cm91-content/v1/health')"
          echo "Health HTTP: $HEALTH_CODE"
          cat "$HEALTH_FILE" || true
          test "$HEALTH_CODE" -ge 200 && test "$HEALTH_CODE" -lt 300
          grep -q '"draft_only":true' "$HEALTH_FILE"
          grep -q '"non_draft_updates_blocked":true' "$HEALTH_FILE"
      - name: Upload content bridge health diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cm91-content-health-${{ github.run_id }}
          path: ${{ runner.temp }}/cm91-content-health.txt
          if-no-files-found: warn
          retention-days: 3

  content:
    name: Import changed content drafts
    runs-on: [self-hosted, linux, x64, seo]
    timeout-minutes: 10
    needs: deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select and validate changed article packages
        id: content_package
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/comiker91-content.zip"
          STAGE="$RUNNER_TEMP/content-stage"
          mkdir -p "$STAGE"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'Manual run: content import intentionally disabled.'
            echo 'has_content=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t DIRS < <(git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA" -- 'content/queue/**' | awk -F/ 'NF >= 4 {print $1"/"$2"/"$3}' | sort -u)
          if [ "${#DIRS[@]}" -eq 0 ]; then
            echo 'No changed content/queue article; skipping import.'
            echo 'has_content=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for dir in "${DIRS[@]}"; do
            test -f "$dir/manifest.json" || { echo "Missing $dir/manifest.json" >&2; exit 1; }
            test -f "$dir/article.html" || { echo "Missing $dir/article.html" >&2; exit 1; }
            php scripts/validate-content-package.php "$dir"
            cp -a "$dir" "$STAGE/"
          done
          (cd "$STAGE" && zip -q -r "$ARCHIVE" . -x '*/.DS_Store' '*/Thumbs.db' '*/.gitkeep')
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo 'has_content=true' >> "$GITHUB_OUTPUT"
      - name: Sign and import changed drafts to WordPress
        if: steps.content_package.outputs.has_content == 'true'
        env:
          CM91_DEPLOY_SECRET: ${{ secrets.CM91_DEPLOY_SECRET }}
          ARCHIVE: ${{ steps.content_package.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CM91_DEPLOY_SECRET:-}" || { echo 'CM91_DEPLOY_SECRET missing.' >&2; exit 1; }
          SIGNATURE="$(openssl dgst -sha256 -hmac "$CM91_DEPLOY_SECRET" "$ARCHIVE" | awk '{print $2}')"
          RESPONSE="$RUNNER_TEMP/content-response.json"
          HTTP_CODE="$(curl --silent --show-error --output "$RESPONSE" --write-out '%{http_code}' --request POST --header "X-CM91-Deploy-Signature: sha256=$SIGNATURE" --header "X-CM91-Commit: $GITHUB_SHA" --form "package=@${ARCHIVE};type=application/zip" 'https://comiker91.de/wp-json/cm91-content/v1/import')"
          cat "$RESPONSE"; echo
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then exit 1; fi
          grep -q '"ok":true' "$RESPONSE"
